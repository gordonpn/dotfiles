name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: runner / test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Just
        uses: extractions/setup-just@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Lint
        run: just lint

      - name: Run unit tests
        run: just test
