# lazygit configuration
# Reference: https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

git:
  # Cycled with '|' (reverse '\'). 'name' is what the cycle notification shows.
  # side-by-side stays first so the default rendering is unchanged.
  diffRenderers:
    - name: side-by-side
      colorArg: always
      command: delta --dark --paging=never --line-numbers
    - name: inline
      colorArg: always
      command: delta-inline --dark --paging=never --line-numbers
gui:
  mainPanelSplitMode: "flexible"
  sideBySideView: auto
  theme:
    activeBorderColor:
      - '#24837B'
      - bold
    inactiveBorderColor:
      - '#403E3C'
    optionsTextColor:
      - '#205EA6'
    selectedLineBgColor:
      - '#282726'
    cherryPickedCommitBgColor:
      - '#343331'
    cherryPickedCommitFgColor:
      - '#24837B'
    unstagedChangesColor:
      - '#AF3029'
    defaultFgColor:
      - '#CECDC3'
keybinding:
  universal:
    # Transposes the defaults: PgUp/PgDn page the list, ',' and '.' scroll the
    # main panel. The -alt1 (K/J) and -alt2 (ctrl+u/ctrl+d) main-panel bindings
    # are separate keys and still apply.
    prevPage: "<pgup>"
    nextPage: "<pgdown>"
    scrollUpMain: ","
    scrollDownMain: "."
