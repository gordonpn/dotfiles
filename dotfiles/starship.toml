"$schema" = "https://starship.rs/config-schema.json"

[kotlin]
disabled = true

[java]
disabled = true

[terraform]
disabled = true

[gradle]
disabled = true

[python]
disabled = true

[nodejs]
disabled = true

[aws]
disabled = false
symbol = ""

[lua]
disabled = true

[ruby]
disabled = true

[package]
disabled = true

[golang]
disabled = true

[rust]
disabled = true

[hostname]
ssh_symbol = ""

[helm]
disabled = true

[time]
disabled = true
time_format = "%T"
utc_time_offset = "0"
format = "[$time UTC]($style) "

[cmd_duration]
disabled = false
min_time = 0


[directory]
truncation_length = 0
truncate_to_repo = false

# Transient prompt used by starship-ftl (`ftl-transient on`): finished commands
# collapse to just the prompt character, so scrollback reads as a list of
# commands. Using $character rather than a literal keeps the success/failure
# colouring of the real prompt (green on success, red on failure).
# Keep [profiles] last — it is a TOML table, so any top-level key placed after
# it would be parsed as part of it.
[profiles]
transient = "$character"
