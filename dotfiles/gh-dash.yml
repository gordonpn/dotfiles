# yaml-language-server: $schema=https://gh-dash.dev/schema.json

# gh-dash configuration
# Reference: https://gh-dash.dev

prSections:
  - title: "All Project PRs"
    filters: "is:open user:gordonpn"
  - title: "Review Required"
    filters: "is:open user:gordonpn review:required"
  - title: "Recently Active"
    filters: >-
      is:open user:gordonpn
      updated:>={{ nowModify "-7d" }}

issuesSections:
  - title: "Created"
    filters: "is:open author:@me"
  - title: "Assigned"
    filters: "is:open assignee:@me"
  - title: "Involved"
    filters: "is:open involves:@me -author:@me"

notificationsSections:
  - title: "New Comments"
    filters: "is:unread reason:comment"
  - title: "Review Requests"
    filters: "is:unread reason:review-requested"
  - title: "CI Activity"
    filters: "is:unread reason:ci-activity"

defaults:
  view: prs
  preview:
    open: true
    width: 65
  refetchIntervalMinutes: 5

smartFilteringAtLaunch: false

confirmQuit: false

repoPaths:
  gordonpn/*: ~/workspace/*

keybindings:
  prs:
    - key: T
      name: "Inspect Actions"
      command: gh enhance -R {{.RepoName}} {{.PrNumber}}

pager:
  diff: delta --dark --line-numbers

theme:
  ui:
    sectionsShowCount: true
  table:
    showSeparators: true
  colors:
    text:
      primary: "#CECDC3"
      secondary: "#878580"
      inverted: "#100F0F"
      faint: "#575653"
      warning: "#AD8301"
      success: "#66800B"
      error: "#AF3029"
    background:
      selected: "#282726"
    border:
      primary: "#24837B"
      secondary: "#205EA6"
      faint: "#403E3C"
